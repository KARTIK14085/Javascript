<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>JavaScript Hello World</title>
</head>
<body>
    <script>
        var name="Lucifer"
        document.write("name:"+name)

        let age="20"
        document.write("<br>age:"+age)

        const pi=3.14
        document.write("<br>PI"+pi)

        var naam="Lucifer"
        var umar="20"
        var sarnamu="lahore"
        document.write("<br>name:"+naam)
        document.write("<br>age:"+umar)
        document.write("<br>city:"+sarnamu)

        let a=10
        let b=20
        document.write("<br>a:"+a)
        document.write("<br>b:"+b)

        let s1=10
        document.write("<br>square:"+s1*s1)
        let c1=10
        document.write("<br>cube:"+c1*c1*c1)

        let c=10
        let f=(c*1.8)+32
        document.write("<br>cel to f:"+f)

        let f1=233
        let cel=(f1-32)*0.56
        document.write("<br>f to c:"+cel)

        let n1=22
        let n2=66
        document.write("<br>add"+(n1+n2))
        document.write("<br>sub:"+(n1-n2))
        document.write("<br>mul"+(n1*n2))
        document.write("<br>que"+(n1/n2))

        var d1="raju"
        document.write("<br>before updating="+d1)
        var d2="Bheem"
        document.write("<br> After updating ="+d2)
</script>
</body>
</html>
