<!DOCTYPE html>
<html>
<head>
    <title>JavaScript</title>
</head>
<body>
    <script>
        var name = "KARTIK";
        document.write("Name : ",name);

        var age = 21;
        document.write("<br><br>Age : ",age);

        const PI = 3.141;
        document.write("<br><br>PI : ",PI);

        document.write("<br> <br>Displaying Name,\ Age and City :");
        var city = "Jamnagar";
        document.write("<br>Name : ",name,"<br>Age : ",age,"<br>City : ",city);

        var a = 5;
        var b = 10;
        
        document.write("<br><br>a = ",a);
        document.write("<br>b = ",b);
        
        document.write("<br><br>Square of the Variable A(5) : ",a*a);
        document.write("<br>Cube of the Variable B(10) : ",b*b*b)

        var celsius = 25;
        var fahrenheit = (celsius * 9/5) + 32;

        document.write("<br><br> 25 celcius to Fahrenhit : ",fahrenheit);
        

        var sum = a + b;
        var difference = a - b;
        var product = a * b;
        var quotient = a / b;

        document.write("<br><br>Sum:", sum);
        document.write("<br>Difference:", difference);
        document.write("<br>Product:", product);
        document.write("<br>Quotient:", quotient);
        

    </script>
